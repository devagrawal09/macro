[package]
edition = "2024"
name = "marketplace"
publish = false
version = "0.1.0"

[dependencies]
agent_code_mode = { path = "../agent_code_mode" }
anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
chrono-tz = { workspace = true }
entity_access = { path = "../entity_access", default-features = false, features = ["ports", "inbound"] }
futures = { workspace = true }
macro_authorization = { path = "../macro_authorization", default-features = false, features = ["axum"] }
macro_user_id = { path = "../macro_user_id" }
model-error-response = { path = "../model-error-response" }
model_owner = { path = "../model_owner" }
rootcause = { workspace = true }
scheduled_action = { path = "../scheduled_action" }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true, features = ["serde", "v7"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
bots = { path = "../bots", default-features = false, features = ["outbound"] }
entity_access = { path = "../entity_access", default-features = false, features = ["outbound"] }
entity_registry = { path = "../entity_registry/entity_registry" }
entity_registry_db_utils = { path = "../entity_registry/entity_registry_db_utils" }
macro_db_migrator = { path = "../macro_db_migrator" }
routine_program = { path = "../routine_program" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
