[package]
edition = "2024"
name = "marketplace"
publish = false
version = "0.1.0"

[dependencies]
agent_code_mode = { path = "../agent_code_mode" }
axum = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
entity_access = { path = "../entity_access", default-features = false, features = ["ports", "inbound"] }
macro_authorization = { path = "../macro_authorization", default-features = false, features = ["axum"] }
macro_user_id = { path = "../macro_user_id" }
model-error-response = { path = "../model-error-response" }
rootcause = { workspace = true }
serde = { workspace = true }
sqlx = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true, features = ["serde", "v7"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
macro_db_migrator = { path = "../macro_db_migrator" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
